<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Deals — Панель управления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0f14;
            --card: #1b1b24;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.35);
            --text: #ffffff;
            --subtext: #9a9ab0;
            --border: rgba(255, 255, 255, 0.08);
            --success: #00b894;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(27, 27, 36, 0.9));
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 18px;
        }

        .user-info h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .user-info p {
            font-size: 13px;
            color: var(--subtext);
            margin-top: 2px;
        }

        .badge {
            background: rgba(0, 184, 148, 0.15);
            color: var(--success);
            border: 1px solid rgba(0, 184, 148, 0.3);
            padding: 6px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--subtext);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix {
            position: absolute;
            left: 14px;
            color: var(--subtext);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background: #121218;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input.with-prefix {
            padding-left: 32px;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .lang-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .lang-btn {
            background: #121218;
            border: 1px solid var(--border);
            color: var(--subtext);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: rgba(108, 92, 231, 0.18);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .cmd-preview {
            background: #121218;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 13px;
            color: #a29bfe;
            margin-top: 10px;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.15s;
            margin-top: 8px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #252532;
            box-shadow: none;
            margin-top: 10px;
            font-size: 14px;
            padding: 11px;
        }

        .hint {
            font-size: 12px;
            color: var(--subtext);
            margin-top: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <h2 id="userName">Загрузка...</h2>
            <p id="userId">ID: —</p>
        </div>
        <div class="badge">Business Active</div>
    </div>

    <!-- Привязка юзернейма получателя -->
    <div class="card">
        <div class="card-title">🎁 Аккаунт для получения подарков</div>
        <div class="input-group">
            <span class="input-prefix">@</span>
            <input type="text" id="receiverInput" class="with-prefix" placeholder="username">
        </div>
        <p class="hint">На этот юзернейм будет автоматически создаваться ссылка <code>tg://send_gift?to=...</code> при принятии оффера.</p>
    </div>

    <!-- Смена языка -->
    <div class="card">
        <div class="card-title">🌐 Язык карточек оффера</div>
        <div class="lang-switch">
            <div class="lang-btn active" id="langRu" onclick="selectLang('ru')">🇷🇺 Русский</div>
            <div class="lang-btn" id="langEn" onclick="selectLang('en')">🇬🇧 English</div>
        </div>
    </div>

    <!-- Генератор быстрой команды -->
    <div class="card">
        <div class="card-title">⚡ Конструктор команды оффера</div>
        <input type="text" id="nftUrl" placeholder="Ссылка: https://t.me/nft/DurovsCap-1234" style="margin-bottom: 8px;" oninput="updateCmd()">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <input type="number" id="nftPrice" placeholder="Цена (500)" value="500" oninput="updateCmd()">
            <select id="nftCurr" onchange="updateCmd()">
                <option value="star">⭐ Stars</option>
                <option value="gram">💎 GRAM</option>
                <option value="usdt">💵 USDT</option>
            </select>
        </div>
        <div class="cmd-preview" id="cmdBox">!создать https://t.me/nft/DurovsCap-1234 500 star</div>
        <button class="btn btn-secondary" onclick="copyCommand()">📋 Скопировать команду для чата</button>
    </div>

    <button class="btn" onclick="saveSettings()">💾 Сохранить настройки в боте</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentLang = 'ru';
        const user = tg.initDataUnsafe?.user;

        // Читаем параметры из URL (если переданы ботом)
        const params = new URLSearchParams(window.location.search);
        const urlReceiver = params.get('receiver');
        const urlLang = params.get('lang');

        if (user) {
            document.getElementById('userName').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('userId').innerText = 'ID: ' + user.id;
            document.getElementById('receiverInput').value = urlReceiver || user.username || '';
        } else if (urlReceiver) {
            document.getElementById('receiverInput').value = urlReceiver;
        }

        if (urlLang === 'en') {
            selectLang('en');
        }

        function selectLang(lang) {
            currentLang = lang;
            document.getElementById('langRu').classList.toggle('active', lang === 'ru');
            document.getElementById('langEn').classList.toggle('active', lang === 'en');
        }

        function updateCmd() {
            const url = document.getElementById('nftUrl').value.trim() || 'https://t.me/nft/DurovsCap-1234';
            const price = document.getElementById('nftPrice').value.trim() || '500';
            const curr = document.getElementById('nftCurr').value;
            document.getElementById('cmdBox').innerText = `!создать ${url} ${price} ${curr}`;
        }

        function copyCommand() {
            const cmdText = document.getElementById('cmdBox').innerText;
            navigator.clipboard.writeText(cmdText);
            tg.showAlert('✅ Команда скопирована! Вставьте её в любой бизнес-чат.');
        }

        function saveSettings() {
            const receiver = document.getElementById('receiverInput').value.replace('@', '').trim();
            if (!receiver) {
                tg.showAlert('❌ Укажите юзернейм для получения подарков!');
                return;
            }
            const payload = JSON.stringify({
                action: "save_settings",
                receiver: receiver,
                lang: currentLang
            });
            tg.sendData(payload);
        }
    </script>
</body>
</html>
